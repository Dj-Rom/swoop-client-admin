<div class="row">
  <div class="dish">
    <img
      class="dish-row__image"
      [src]="item.imageUrl ?? 'https://placehold.co/64x64'"
      [alt]="item.name"
    />

    <div>
      <h3 class="dish__title">
        {{ item.name }}
      </h3>

      <p class="dish__category">
        {{ item.categoryName || 'Uncategorized' }}
        <!-- Исправлено: category -> categoryName -->
      </p>

      <span class="dish__badge" *ngIf="item.badgeLabel">
        <!-- Добавлено условие -->
        {{ item.badgeLabel }}
      </span>
    </div>
  </div>

  <div class="description">
    {{ item.description || 'No description' }}
    <!-- Добавлена обработка null -->
  </div>

  <div class="price">
    {{ item.price | number: '1.2-2' }}
  </div>

  <div class="tags">
    <app-tag *ngFor="let diet of item.diets" [label]="diet"></app-tag>
  </div>

  <div class="tags">
    <app-tag *ngFor="let allergen of item.allergens" [label]="allergen"></app-tag>
  </div>

  <div class="date">
    {{ item.createdAt | date: 'mediumDate' }}
    <!-- Исправлено: dateAdded -> createdAt -->
  </div>

  <app-toggle-switch [checked]="item.isStopList" (checkedChange)="onStopListToggled($event)">
  </app-toggle-switch>
</div>
