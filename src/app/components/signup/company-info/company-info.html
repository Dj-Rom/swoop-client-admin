<div class="auth-page">
  <section class="auth-panel">
    <div class="auth-panel__inner">
      <h1 class="auth-title">Company Details</h1>
      <p class="auth-subtitle">Step 2 of 3 — Restaurant Information</p>

      <form [formGroup]="form" (ngSubmit)="continue()" novalidate>
        <div class="field">
          <label class="field__label" for="placeName">Restaurant Name *</label>
          <input
            id="placeName"
            type="text"
            class="field__input"
            placeholder="La Trattoria"
            formControlName="placeName"
            [class.field__input--error]="placeNameInvalid"
          />
          <p class="field__error" *ngIf="placeNameInvalid">Restaurant name is required.</p>
        </div>

        <div class="field-row field-row--3">
          <div class="field">
            <label class="field__label" for="nip">NIP</label>
            <input
              id="nip"
              type="text"
              class="field__input"
              placeholder="1234567890"
              formControlName="nip"
            />
          </div>
          <div class="field">
            <label class="field__label" for="regon">REGON</label>
            <input
              id="regon"
              type="text"
              class="field__input"
              placeholder="123456789"
              formControlName="regon"
            />
          </div>
          <div class="field">
            <label class="field__label" for="krs">KRS</label>
            <input
              id="krs"
              type="text"
              class="field__input"
              placeholder="1234567890"
              formControlName="krs"
            />
          </div>
        </div>

        <div class="field">
          <label class="field__label" for="address">Address</label>
          <input
            id="address"
            type="text"
            class="field__input"
            placeholder="ul. Marszałkowska 15"
            formControlName="address"
          />
        </div>

        <div class="field-row">
          <div class="field">
            <label class="field__label" for="city">City</label>
            <input
              id="city"
              type="text"
              class="field__input"
              placeholder="Warszawa"
              formControlName="city"
            />
          </div>
          <div class="field">
            <label class="field__label" for="postalCode">Postal Code</label>
            <input
              id="postalCode"
              type="text"
              class="field__input"
              placeholder="00-001"
              formControlName="postalCode"
            />
          </div>
        </div>

        <div class="field">
          <label class="field__label" for="website">Website</label>
          <input
            id="website"
            type="url"
            class="field__input"
            placeholder="https://your-restaurant.com"
            formControlName="website"
          />
        </div>

        <div class="btn-row">
          <button type="button" class="btn btn--outline" (click)="back()">← Back</button>
          <button type="submit" class="btn btn--primary">Continue</button>
        </div>
      </form>
    </div>
  </section>
</div>
